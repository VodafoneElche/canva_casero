name: Compilar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Instalador de Windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar MinGW y NSIS
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 nsis

      - name: Versión
        id: ver
        run: |
          # El número sale de CMakeLists.txt: project(LienzoCasero VERSION x.y.z ...)
          v=$(sed -n 's/^project(LienzoCasero VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # En main se publica sola cada versión nueva (si aún no está en Releases)
          if [[ "$GITHUB_REF" == refs/heads/main ]] && ! gh release view "v$v" >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compilar LienzoCasero.exe
        run: |
          cmake -B build-win -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-win -j

      - name: Crear el instalador
        run: |
          makensis -DEXE="$PWD/build-win/LienzoCasero.exe" \
                   -DVERSION="${{ steps.ver.outputs.version }}" \
                   -DOUTFILE="$PWD/LienzoCasero-${{ steps.ver.outputs.version }}-instalador.exe" \
                   installer/lienzo-casero.nsi

      - name: Guardar el instalador
        uses: actions/upload-artifact@v4
        with:
          name: LienzoCasero-instalador-windows
          path: |
            LienzoCasero-*-instalador.exe
            build-win/LienzoCasero.exe

      - name: Publicar versión en Releases (la buscan los programas para actualizarse)
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Lienzo Casero ${{ steps.ver.outputs.version }}
          body: |
            Descarga `LienzoCasero-${{ steps.ver.outputs.version }}-instalador.exe` y ábrelo.
            Si ya tienes Lienzo Casero 0.9.1 o más nuevo, el programa te avisa solo y se actualiza.
          files: LienzoCasero-*-instalador.exe

  linux:
    name: Comprobar que compila en Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Compilar
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
